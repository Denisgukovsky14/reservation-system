<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>(function(){function a(){if(localStorage.getItem('theme')==='light'){document.documentElement.setAttribute('data-theme','light');}else{document.documentElement.removeAttribute('data-theme');}}a();window.addEventListener('pageshow',function(e){if(e.persisted)a();});})();</script>
    <link href="/src/styles/main.css" rel="stylesheet" type="text/css">
    <link href="/src/styles/pages/workflow.css" rel="stylesheet" type="text/css">
    <title>Создание заявки — DesignHub</title>
</head>
<body>

<div id="header-placeholder"></div>

<main class="workflow-main">
    <div class="workflow-container">

        <!-- Степпер только с 2 шагами -->
        <div class="stepper">
            <div class="step active" data-step="1">
                <div class="step-circle">1</div>
                <div class="step-label">Создание заявки</div>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="2">
                <div class="step-circle">2</div>
                <div class="step-label">Техническая карта</div>
            </div>
        </div>

        <div class="steps-content">

            <!-- Шаг 1: Базовая информация -->
            <section id="step1" class="step-panel active">
                <h2>Базовая информация о проекте</h2>
                <form id="form-request" class="workflow-form">
                    <div class="form-row">
                        <div class="form-group" style="flex: 2;">
                            <label>Название проекта</label>
                            <input type="text" id="projectName" placeholder="Например: Изготовка фасада">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Категория</label>
                            <select id="category" class="custom-select">
                                <option value="Коммерческий интерьер">Коммерческий интерьер</option>
                                <option value="Жилой интерьер">Жилой интерьер</option>
                                <option value="Ландшафтный дизайн">Ландшафтный дизайн</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Бюджет (₽)</label>
                            <input type="number" id="budget" placeholder="Укажите примерный бюджет">
                        </div>
                        <div class="form-group">
                            <label>Дедлайн</label>
                            <input type="date" id="deadline">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Описание задачи</label>
                        <textarea id="description" rows="4" placeholder="Опишите суть проекта..."></textarea>
                    </div>

                    <!-- Блок выбора услуг -->
                    <div class="form-group">
                        <label>Выберите необходимые услуги</label>
                        <div id="services-selector" class="services-selector">
                            <div class="loading-services">Загрузка услуг...</div>
                        </div>
                    </div>

                    <div class="form-actions right">
                        <button type="button" class="btn btn-blue next-step">Далее: Техническая карта</button>
                    </div>
                </form>
            </section>

            <!-- Шаг 2: Техническая карта -->
            <section id="step2" class="step-panel">
                <h2>Техническая карта проекта</h2>
                <div class="tech-map-grid">
                    <div class="tech-card">
                        <h3>Параметры объекта (Необязательно)</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Площадь (кв.м)</label>
                                <input type="number" id="area" placeholder="Укажите площадь">
                            </div>
                            <div class="form-group">
                                <label>Высота потолков (м)</label>
                                <input type="number" id="height" placeholder="Укажите высоту">
                            </div>
                        </div>
                    </div>
                    <div class="tech-card file-upload-area">
                        <h3>Чертежи и референсы</h3>
                        <div class="upload-box" id="uploadBox">
                            <span>Перетащите файлы сюда или нажмите для загрузки</span>
                            <input type="file" multiple hidden id="fileUpload" accept="image/*,.pdf,.dwg">
                            <button type="button" class="btn btn-dark" id="selectFilesBtn">Выбрать файлы</button>
                        </div>
                        <div id="fileList" class="file-list">
                            <!-- Здесь будут отображаться выбранные файлы -->
                        </div>
                    </div>
                </div>
                <div class="form-actions right">
                    <button type="button" class="btn btn-dark prev-step">Назад</button>
                    <button type="button" class="btn btn-blue" id="showContractorsBtn">Показать подрядчиков</button>
                </div>
            </section>

        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="/src/scripts/utils/apiFetch.js"></script>
<script src="/src/scripts/utils/renderHeader.js"></script>

<script type="module">
    import { loadPricingModal } from '/src/components/pricing/pricing.js';
    loadPricingModal();
</script>

<script src="/src/scripts/pages/workflow.js"></script>
<script src="/src/scripts/utils/loadComponents.js"></script>

</body>
</html>
