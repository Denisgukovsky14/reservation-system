spring.application.name=DesignHub

# Секреты (пароль БД, jwt.secret) лежат в application-local.properties, он в .gitignore.
# Образец: application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5434/postgres
spring.datasource.username=postgres

logging.level.root=info
logging.level.com.sarcofuckusLesson.designub=INFO

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.expiration-ms=86400000
